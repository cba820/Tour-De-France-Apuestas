{% extends "vuelta/base.html" %}
{% block title %}Crear cuenta · Apuestas La Vuelta 2026{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="text-center mb-4">
      <div class="display-6 fw-bold">🚴 Apuestas <span class="text-white bg-danger px-2 rounded">La Vuelta 2026</span></div>
      <p class="text-muted">Crea tu cuenta y únete a la competición.</p>
    </div>
    <div class="card">
      <div class="card-header"><i class="bi bi-person-plus-fill"></i> Crear cuenta</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label small">Nombre de usuario</label>
            <input type="text" name="username" class="form-control" value="{{ username or '' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label small">Email</label>
            <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
          </div>
          <div class="row">
            <div class="col mb-3">
              <label class="form-label small">Contraseña</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="col mb-3">
              <label class="form-label small">Repetir</label>
              <input type="password" name="password2" class="form-control" required>
            </div>
          </div>
          <button type="submit" class="btn btn-vuelta w-100">Crear cuenta</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-3 text-muted">
      ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
    </p>
  </div>
</div>
{% endblock %}
