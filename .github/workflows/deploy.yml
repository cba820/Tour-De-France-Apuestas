name: Deploy to EC2

# Despliega automáticamente al hacer push a main.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Evita despliegues solapados si se hacen varios push seguidos.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Desplegar en el servidor
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s <<'EOF'
          set -e
          cd /home/ec2-user/TDF_apuestas

          echo "==> Respaldo de la base de datos"
          # Copia fechada (se conservan las 10 mas recientes) + la copia .bak de
          # siempre. Importa porque la base guarda el historico del Tour y de
          # La Vuelta: usuarios, apuestas, resultados y puntos.
          if [ -f instance/tdf.db ]; then
            cp instance/tdf.db "instance/tdf.db.bak"
            cp instance/tdf.db "instance/tdf.db.$(date +%Y%m%d-%H%M%S).bak"
            ls -1t instance/tdf.db.*-*.bak 2>/dev/null | tail -n +11 | xargs -r rm -f
          fi

          echo "==> Trayendo el código nuevo"
          git fetch --all --prune
          git reset --hard origin/main

          echo "==> Instalando dependencias"
          if [ -d .venv ]; then
            . .venv/bin/activate
          fi
          pip install -r requirements.txt

          echo "==> Reiniciando el servicio"
          # Al arrancar, create_app() ejecuta db.create_all() + los seeders de
          # ambas competencias. Es idempotente: crea solo lo que falte y no
          # toca ni borra datos existentes.
          sudo systemctl restart tdf

          echo "==> Esperando a que el servicio responda"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1/login; then
              echo "    servicio arriba tras ${i}s"
              break
            fi
            sleep 1
          done

          echo "==> Diagnostico post-deploy"
          # No falla el deploy si el diagnostico encuentra avisos: solo informa.
          if [ -d .venv ]; then PY=.venv/bin/python; else PY=python3; fi
          $PY scripts/diagnostico.py || true

          echo "==> Deploy completado"
          EOF
